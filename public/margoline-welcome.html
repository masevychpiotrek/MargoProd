  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/* logo — always amber, never changes */\n    --logo:212,168,37;\n    --logo-hex:#d4a825;\n    --logo-hi:#f0c84a;\n    /* ui accent — set by theme */\n    --acc:212,168,37;\n    --acc-hex:#d4a825;\n    --acc-hi:#f0c84a;\n    --acc-lo:#7a5010;\n    --acc-glow:rgba(212,168,37,.18);\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  html,body{width:100%;height:100%;overflow:hidden;background:#030507}\n  body{font-family:'DM Mono',monospace;color:#8fa8bc;user-select:none;cursor:default}\n  canvas{position:fixed;inset:0;display:block;will-change:transform}\n  #bg{z-index:0}\n  #main{z-index:1}\n\n  /* ── CORNER MARKS ── */\n  .cm{position:fixed;width:24px;height:24px;z-index:5;pointer-events:none;\n      opacity:0;transition:opacity 1.4s ease .4s}\n  body.live .cm{opacity:.6}\n  .cm::before,.cm::after{content:'';position:absolute;background:var(--acc-hex)}\n  .cm::before{width:100%;height:1px}\n  .cm::after{width:1px;height:100%}\n  .cm-tl{top:28px;left:28px}\n  .cm-tr{top:28px;right:28px}.cm-tr::after{right:0;left:auto}\n  .cm-bl{bottom:28px;left:28px}.cm-bl::before{bottom:0;top:auto}\n  .cm-br{bottom:28px;right:28px}.cm-br::after{right:0;left:auto}.cm-br::before{bottom:0;top:auto}\n\n  /* ── TOP BAR ── */\n  .topbar{position:fixed;top:0;left:0;right:0;z-index:6;\n    display:flex;justify-content:space-between;align-items:center;\n    padding:28px 44px;\n    opacity:0;transform:translateY(-8px);\n    transition:opacity 1s ease,transform 1s ease}\n  body.live .topbar{opacity:1;transform:none}\n\n  .brand{display:flex;align-items:center;gap:13px}\n  .hex-mark{width:26px;height:26px;flex:none}\n  .hex-mark svg{width:100%;height:100%}\n  .b-name{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;\n    letter-spacing:.38em;color:var(--logo-hex);line-height:1}\n  .b-div{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 4px}\n  .b-sub{font-size:9.5px;letter-spacing:.28em;color:#3d5060;text-transform:uppercase}\n\n  .topright{display:flex;align-items:center;gap:20px;font-size:9.5px;letter-spacing:.18em}\n  #clock{color:#3d5060}\n  /* status pill always green — semantic, not brand */\n  .pill{display:flex;align-items:center;gap:7px;color:rgba(125,220,155,.75);\n    padding:5px 11px;border:1px solid rgba(80,200,120,.18);border-radius:1px}\n  .pill .dot{width:5px;height:5px;border-radius:50%;background:#4dc878;\n    box-shadow:0 0 6px #4dc878;animation:blink 2.2s ease-in-out infinite}\n  @keyframes blink{0%,100%{opacity:1}55%{opacity:.2}}\n\n  /* ── PHASE / PROGRESS ── */\n  .readout{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);\n    z-index:6;width:320px;text-align:center;\n    opacity:0;transition:opacity .8s ease}\n  body.live .readout{opacity:1}\n  body.finale .readout{opacity:0;pointer-events:none;transition:opacity .5s ease}\n  #phaseLabel{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#3d5060;\n    margin-bottom:12px;min-height:12px}\n  #phaseLabel::before{content:'↳ ';color:var(--acc-hex)}\n  .progress{height:1px;background:rgba(255,255,255,.06);overflow:hidden}\n  #sf{height:100%;width:0%;\n    background:linear-gradient(90deg,var(--acc-lo),var(--acc-hex),var(--acc-hi));\n    transition:width 1.6s cubic-bezier(.16,.84,.2,1)}\n\n  /* ── FINALE SCRIM ── */\n  .scrim{position:fixed;left:0;right:0;bottom:0;height:55%;z-index:4;pointer-events:none;\n    opacity:0;transition:opacity 1.2s ease;\n    background:radial-gradient(140% 100% at 50% 100%,\n      #030507 0%,rgba(3,5,7,.85) 30%,rgba(3,5,7,0) 72%)}\n  body.finale .scrim{opacity:1}\n\n  /* ── FINALE LOCKUP ── */\n  .lockup{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);\n    z-index:7;text-align:center;pointer-events:none}\n  @keyframes badgeGlow{\n    0%,100%{box-shadow:0 0 8px rgba(74,58,158,.3),inset 0 0 0 1px rgba(74,58,158,.4)}\n    50%{box-shadow:0 0 26px rgba(74,58,158,.65),inset 0 0 0 1px rgba(122,106,200,.8)}\n  }\n  @keyframes badgeScan{\n    0%{background-position:-200% center}\n    100%{background-position:200% center}\n  }\n  #badge{display:inline-block;font-size:9px;letter-spacing:.3em;text-transform:uppercase;\n    color:var(--logo-hex);padding:7px 18px;\n    border:1px solid rgba(74,58,158,.55);\n    background:linear-gradient(90deg,rgba(3,5,7,.95) 0%,rgba(74,58,158,.1) 50%,rgba(3,5,7,.95) 100%);\n    background-size:200% 100%;\n    margin-top:16px;margin-bottom:6px;\n    opacity:0;transform:translateY(8px);transition:opacity .8s ease .2s,transform .8s ease .2s}\n  #badge.show{\n    animation:badgeGlow 2.4s ease-in-out infinite,badgeScan 3s linear infinite !important;\n    transform:none !important;opacity:1 !important\n  }\n  #appName{font-family:'Chakra Petch',sans-serif;font-weight:700;\n    font-size:clamp(28px,3.8vw,56px);letter-spacing:.36em;line-height:1;\n    background:linear-gradient(175deg,#ffffff 0%,var(--logo-hex) 100%);\n    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;\n    filter:drop-shadow(0 2px 22px rgba(212,168,37,.3));\n    opacity:0;transform:translateY(14px) scale(.98);\n    transition:opacity 1s cubic-bezier(.16,.84,.2,1),transform 1s cubic-bezier(.16,.84,.2,1)}\n  #appSub{font-size:9px;letter-spacing:.34em;text-transform:uppercase;\n    color:#3d5060;margin-top:14px;\n    opacity:0;transform:translateY(8px);\n    transition:opacity .9s ease .1s,transform .9s ease .1s}\n  #readyWrap{margin-top:20px;pointer-events:all;\n    opacity:0;transform:translateY(10px);\n    transition:opacity .8s ease,transform .8s ease}\n  #enterBtn{font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:10px;\n    letter-spacing:.32em;text-transform:uppercase;cursor:pointer;\n    padding:13px 38px;background:none;\n    border:1px solid rgba(var(--acc),.45);color:var(--logo-hex);\n    position:relative;overflow:hidden;\n    transition:border-color .3s,box-shadow .3s}\n  #enterBtn::before{content:'';position:absolute;inset:0;\n    background:rgba(var(--acc),.07);\n    transform:scaleX(0);transform-origin:left;transition:transform .35s ease}\n  #enterBtn:hover{border-color:rgba(var(--acc),.8);\n    box-shadow:0 0 24px rgba(var(--acc),.16)}\n  #enterBtn:hover::before{transform:scaleX(1)}\n  #enterBtn:active{opacity:.8}\n  #meta{margin-top:32px;opacity:0;transition:opacity 1.2s ease;text-align:center}\n  .meta-copy{\n    font-size:9px;letter-spacing:.2em;\n    color:#4e6878;\n    margin-bottom:16px;\n    line-height:1.8\n  }\n  .meta-sig-block{display:inline-block;border-top:1px solid rgba(255,255,255,.06);padding-top:13px}\n  .meta-by{font-size:7px;letter-spacing:.36em;color:#3a4e5c;text-transform:uppercase;margin-bottom:6px}\n  .meta-sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;\n    font-size:26px;letter-spacing:.06em;color:#c4ae88;line-height:1;display:block;\n    text-shadow:0 0 28px rgba(212,168,37,.2)}\n\n  .show{opacity:1 !important;transform:none !important}\n\n  /* ── COLOR SWITCHER ── */\n  .palettes{position:fixed;bottom:28px;left:44px;z-index:8;\n    display:flex;align-items:center;gap:10px;\n    opacity:0;transition:opacity .8s ease .5s}\n  body.live .palettes{opacity:1}\n  .pal-label{font-size:8px;letter-spacing:.22em;color:#2a3840;margin-right:4px}\n  .swatch{width:9px;height:9px;border-radius:50%;cursor:pointer;\n    transition:transform .2s,box-shadow .2s;\n    border:1px solid rgba(255,255,255,.15)}\n  .swatch{width:20px;height:9px;border-radius:4px;cursor:pointer;\n    transition:transform .2s,box-shadow .2s,opacity .2s;\n    border:1px solid rgba(255,255,255,.1);opacity:.55;position:relative}\n  .swatch:hover,.swatch.active{transform:scaleY(1.4);opacity:1}\n  .swatch.active{box-shadow:0 0 8px var(--sw,#fff)}\n  /* left half always amber, right half = accent */\n  .swatch::before{content:'';position:absolute;left:0;top:0;width:50%;height:100%;\n    background:#d4a825;border-radius:3px 0 0 3px}\n  .swatch::after{content:'';position:absolute;right:0;top:0;width:50%;height:100%;\n    background:var(--sw);border-radius:0 3px 3px 0}\n\n  /* ── REPLAY ── */\n  .replay-btn{position:fixed;bottom:28px;right:44px;z-index:8;\n    font-size:8.5px;letter-spacing:.22em;color:#2a3840;cursor:pointer;\n    display:flex;align-items:center;gap:7px;\n    padding:7px 11px;border:1px solid rgba(255,255,255,.06);\n    background:rgba(3,5,7,.6);\n    opacity:0;transition:opacity .6s ease,color .25s,border-color .25s}\n  body.live .replay-btn{opacity:.7}\n  .replay-btn:hover{color:#6f8898;border-color:rgba(255,255,255,.14)}\n\n  /* ── FLASH ── */\n  .flash{position:fixed;inset:0;z-index:20;background:var(--acc-hex);opacity:0;pointer-events:none}\n  .flash.go{animation:fl .9s ease forwards}\n  @keyframes fl{0%{opacity:0}12%{opacity:.3}100%{opacity:0}}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n  <canvas id=\"bg\"><\u002Fcanvas>\n  <canvas id=\"main\"><\u002Fcanvas>\n\n  <div class=\"cm cm-tl\"><\u002Fdiv>\n  <div class=\"cm cm-tr\"><\u002Fdiv>\n  <div class=\"cm cm-bl\"><\u002Fdiv>\n  <div class=\"cm cm-br\"><\u002Fdiv>\n\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"hex-mark\">\n        <svg viewBox=\"0 0 60 60\" fill=\"none\">\n          <polygon points=\"30,4 52,17 52,43 30,56 8,43 8,17\" style=\"stroke:var(--logo-hex);stroke-width:2.5;fill:rgba(212,168,37,.05)\"><\u002Fpolygon>\n          <polygon points=\"30,18 42,25 42,39 30,46 18,39 18,25\" style=\"stroke:var(--logo-hex);stroke-width:1.2;fill:none;opacity:.36\"><\u002Fpolygon>\n          <circle cx=\"30\" cy=\"30\" r=\"3.5\" style=\"fill:var(--logo-hex)\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"b-name\">MARGOLINE<\u002Fdiv>\n      <div class=\"b-div\"><\u002Fdiv>\n      <div class=\"b-sub\">System Monitorowania Produkcji<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"topright\">\n      <span id=\"clock\">--:--:--<\u002Fspan>\n      <span class=\"pill\"><i class=\"dot\"><\u002Fi>ONLINE<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"readout\">\n    <div id=\"phaseLabel\"><\u002Fdiv>\n    <div class=\"progress\"><div id=\"sf\"><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"scrim\"><\u002Fdiv>\n\n  <div class=\"lockup\">\n    <h1 id=\"appName\">MARGOLINE<\u002Fh1>\n    <div id=\"appSub\">System Monitorowania Produkcji<\u002Fdiv>\n    <div id=\"badge\">✓&nbsp; Inicjalizacja zakończona<\u002Fdiv>\n    <div id=\"readyWrap\">\n      <button id=\"enterBtn\">Wejdź do systemu<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"meta\">\n      <div class=\"meta-copy\">v2.0 beta &nbsp;·&nbsp; © Margoline 2025<\u002Fdiv>\n      <div class=\"meta-sig-block\">\n        <div class=\"meta-by\">Created by<\u002Fdiv>\n        <span class=\"meta-sig\">Masevych<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- COLOR PALETTES -->\n  <div class=\"palettes\">\n    <span class=\"pal-label\">MOTYW<\u002Fspan>\n    <div class=\"swatch active\" data-theme=\"amber\" style=\"--sw:#d4a825\" title=\"Amber — monochrom\"><\u002Fdiv>\n    <div class=\"swatch\" data-theme=\"acier\" style=\"--sw:#1e6fa5\" title=\"Acier — amber + granat\"><\u002Fdiv>\n    <div class=\"swatch\" data-theme=\"miedz\" style=\"--sw:#b8622a\" title=\"Miedź — amber + miedź\"><\u002Fdiv>\n    <div class=\"swatch\" data-theme=\"platyna\" style=\"--sw:#6a8ea8\" title=\"Platyna — amber + platyna\"><\u002Fdiv>\n    <div class=\"swatch\" data-theme=\"indygo\" style=\"--sw:#4a3a9e\" title=\"Indygo — amber + indygo\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"replay-btn\" id=\"replay\">↺ odtwórz<\u002Fdiv>\n  <div class=\"flash\" id=\"flash\"><\u002Fdiv>\n\n  <script>\n  /* ── clock ── */\n  function tickClock(){const d=new Date(),p=n=>String(n).padStart(2,'0');document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}\n  tickClock();setInterval(tickClock,1000);\n\n  /* ── themes ── */\n  /* ── 5 pairs: logo always amber, accent varies ── */\n  const THEMES={\n    amber:  {acc:'212,168,37', hex:'#d4a825',hi:'#f0c84a',lo:'#7a5010',glow:'rgba(212,168,37,.18)'},\n    acier:  {acc:'30,111,165', hex:'#1e6fa5',hi:'#4a9eda',lo:'#0a2840',glow:'rgba(30,111,165,.2)'},\n    miedz:  {acc:'184,98,42',  hex:'#b8622a',hi:'#e08050',lo:'#5a2810',glow:'rgba(184,98,42,.2)'},\n    platyna:{acc:'106,142,168',hex:'#6a8ea8',hi:'#8fb3c8',lo:'#2a3a48',glow:'rgba(106,142,168,.16)'},\n    indygo: {acc:'74,58,158',  hex:'#4a3a9e',hi:'#7a6ac8',lo:'#1e1648',glow:'rgba(74,58,158,.22)'},\n  };\n  function applyTheme(name){\n    const t=THEMES[name];if(!t)return;\n    const r=document.documentElement.style;\n    /* only accent changes — logo vars are fixed in :root */\n    r.setProperty('--acc',t.acc);\n    r.setProperty('--acc-hex',t.hex);\n    r.setProperty('--acc-hi',t.hi);\n    r.setProperty('--acc-lo',t.lo);\n    r.setProperty('--acc-glow',t.glow);\n    window.__mlAccent={hex:t.hex,hi:t.hi};\n    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active',s.dataset.theme===name));\n    localStorage.setItem('mgl_theme',name);\n  }\n  document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>applyTheme(s.dataset.theme)));\n  applyTheme(localStorage.getItem('mgl_theme')||'indygo');\n\n  /* ── robust finale reveal via polling ── */\n  const FINALE_IDS=['badge','appName','appSub'];\n  let _fa=false, _t1,_t2;\n  function showFinale(){\n    if(_fa)return; _fa=true;\n    document.body.classList.add('finale');\n    FINALE_IDS.forEach(id=>document.getElementById(id)?.classList.add('show'));\n    _t1=setTimeout(()=>{\n      document.getElementById('readyWrap')?.classList.add('show');\n      document.getElementById('sf').style.width='100%';\n    },600);\n    _t2=setTimeout(()=>document.getElementById('meta')?.classList.add('show'),900);\n  }\n  function hideFinale(){\n    _fa=false;\n    clearTimeout(_t1);clearTimeout(_t2);\n    document.body.classList.remove('finale');\n    ['badge','appName','appSub','readyWrap','meta'].forEach(id=>document.getElementById(id)?.classList.remove('show'));\n    document.getElementById('sf').style.width='0%';\n  }\n  setInterval(()=>{\n    const p=window.__mlPhase?.();\n    if((p==='finale'||p==='done')&&!_fa) showFinale();\n  },120);\n\n  /* ── enter & replay ── */\n  const flash=document.getElementById('flash');\n  function doRestart(){\n    hideFinale();\n    if(window.__mlResume)window.__mlResume();\n    if(window.__mlRestart)window.__mlRestart();\n  }\n  document.getElementById('enterBtn').addEventListener('click',()=>{\n    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');\n    setTimeout(doRestart,750);\n  });\n  document.getElementById('replay').addEventListener('click',doRestart);\n  <\u002Fscript>\n  <script src=\"d22019bb-560a-4afa-8ef1-e0e50f344ea4\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
